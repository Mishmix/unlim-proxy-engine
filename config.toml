# Unlim Proxy configuration.
#
# Every value here can be overridden by an environment variable named
# UNLIMPROXY_<SECTION>__<KEY>, e.g. UNLIMPROXY_APP__LOG_LEVEL=DEBUG.
# API_KEY is read from the plain `API_KEY` env var (see .env.example).

[app]
db_path = "./data/proxies.db"
host = "0.0.0.0"
port = 8000
log_level = "INFO"
rotation_cooldown_sec = 30
rotation_top_n = 20

[scraper]
interval_sec = 180          # full re-scrape of every source (every 3 minutes)
concurrency = 20            # parallel source fetches
timeout_sec = 60
max_bytes = 33554432        # 32 MiB hard cap per source response

[checker]
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36"
l1_url = "https://www.google.com/generate_204"
l2_url = "https://www.google.com/search"
connect_timeout_sec = 5
tcp_probe_timeout_sec = 2   # raw TCP pre-probe only; 94 % of live proxies answer inside it
l1_total_timeout_sec = 8
l2_total_timeout_sec = 12
l2_min_interval_sec = 600   # never L2-check the same proxy more often than this
l2_ok_min_bytes = 20000
l2_partial_min_bytes = 100
l2_queries = [
    "weather", "recipe", "python", "news", "dictionary", "map", "train",
    "coffee", "guitar", "library", "bicycle", "garden", "museum", "sunset",
]
yt_search_url = "https://www.youtube.com/results?search_query=test&sp=EgIQAg%3D%3D"
yt_channel_url = "https://www.youtube.com/@YouTube/about"
yt_total_timeout_sec = 12
yt_ok_min_bytes = 10000
# A real YouTube page carries this bootstrap payload; an interstitial or a proxy's own
# error page does not. Matching on "recaptcha" instead rejects every healthy page.
yt_required_marker = "ytInitialData"
yt_min_interval_sec = 1800  # never re-probe YouTube for the same proxy more often
anonymity_ip_url = "https://api.ipify.org?format=json"
anonymity_judge_url = "http://azenv.net/"
protocol_probe_order = ["socks5", "socks4", "http"]

[queues]
# Interval = how often the queue is swept. Concurrency = simultaneous checks.
# Raising cold_concurrency is the single biggest speed lever. Measured on one host,
# 6000 dead candidates: 200 -> 81 checks/s, 400 -> 140, 800 -> 198, 1600 -> 268,
# 3000 -> 297. CPU stayed under 10 % throughout, so the ceiling is the network path,
# not the process. A crossover run at 400 vs 1600 recovered 53.4 % and 56.0 % of the
# same live set, so the extra concurrency costs no accuracy — but see the README on
# consumer NAT, where a table that small collapses the pool instead.
cold_concurrency = 1000
cold_batch = 2000
cold_window_batches = 10    # rows pulled per cold query, in units of cold_batch
# hot_batch — сколько живых прокси успевает перепроверить один проход. Всё, что
# проход не достал за hot_interval_sec, стареет мимо max_age_sec API и перестаёт
# выдаваться, поэтому этот потолок и есть настоящий потолок пула: сколько бы
# холодная очередь ни нашла, живыми считаются только те, кого успели подтвердить.
# Держать выше ожидаемого числа живых.
hot_interval_sec = 90
hot_concurrency = 200
hot_batch = 6000
warm_interval_sec = 300
warm_concurrency = 200
l2_interval_sec = 60      # sweep cadence; each proxy is still gated by checker.l2_min_interval_sec
l2_concurrency = 30
# Backs the ?target= filter; each proxy is still gated by checker.yt_min_interval_sec.
# yt_batch has to cover the whole live pool inside that window, or the set the filter
# serves is whatever fraction of the pool the sweep last reached. At 480 per 60 s that
# is 28 800 probes per re-probe window against a pool in the low thousands.
yt_interval_sec = 60
yt_concurrency = 60
yt_batch = 480
# Consecutive failed probes before a proxy loses its YouTube flags. One miss is noise —
# two page loads through a free proxy fail for reasons unrelated to YouTube — and
# clearing on the first one is what made ?target=youtube collapse to zero on a beat.
yt_fail_grace = 2
quarantine_interval_sec = 1800
quarantine_concurrency = 50
fail_streak_quarantine = 3
fail_streak_delete = 10
stale_unseen_days = 7

[geo]
country_url = "https://media.githubusercontent.com/media/iplocate/ip-address-databases/main/ip-to-country/ip-to-country.mmdb"
asn_url = "https://media.githubusercontent.com/media/iplocate/ip-address-databases/main/ip-to-asn/ip-to-asn.mmdb"
city_url = "https://download.db-ip.com/free/dbip-city-lite-{year}-{month}.mmdb.gz"
dir = "./data/geo"
refresh_interval_sec = 86400
download_timeout_sec = 600
datacenter_keywords = [
    "hosting", "cloud", "datacenter", "data center", "server", "vps", "vpn",
    "colo", "ovh", "hetzner", "digitalocean", "amazon", "aws", "google",
    "microsoft", "azure", "linode", "vultr", "leaseweb", "contabo", "scaleway",
    "choopa", "oracle", "alibaba", "tencent", "m247", "psychz", "quadranet",
]

# ───────────────────────────────────────────────────────────────────────────
# Sources — copied verbatim from the verified list (all HTTP 200 on 25.07.2026).
#
# parser:
#   prefixed — lines like socks5://1.2.3.4:1080 (protocol is trustworthy)
#   plain    — lines like 1.2.3.4:8080 (protocol is a hypothesis, verified by handshake)
#   geonode  — JSON API with metadata
#   hideip   — 1.2.3.4:8080:CountryName
#
# trust_protocol = false means: the file name promises a protocol, but the source
# dumps the same list into every file. Determine the protocol by handshake.
# ───────────────────────────────────────────────────────────────────────────

# ─── priority: honest protocol labels, high hit rate ───────────────────────

