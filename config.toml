# ─── Bulk aggregate dumps ────────────────────────────────────────────────────
#
# Measured incremental yield against everything above, 2026-07-27: these carry the
# pool from 138 873 to roughly 585 000 distinct endpoints. They are unvalidated
# scrapes, so their hit rate is far below the curated lists and they all sit at
# priority 4 — the cold queue drains them last, and `cold_queue_weight` demotes them
# further on measured hit rate once a source has 1000 checked candidates.
#
# Sources that only relabel addresses we already hold under a different protocol were
# rejected on purpose. ProxRipper's socks5 dump, for one, adds 202 new endpoints and
# 146 783 new rows; that is three times the check load for the same machines.

