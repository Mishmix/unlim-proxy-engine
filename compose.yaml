services:
  unlimproxy:
    build: .
    image: unlimproxy:latest
    container_name: unlimproxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    # env_file configuration
    env_file:
      - .env
    environment:
      # Leave empty to keep the API open. Set it to require `X-API-Key`.
      API_KEY: "${API_KEY:-}"
      UNLIMPROXY_APP__LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      UNLIMPROXY_QUEUES__COLD_CONCURRENCY: "${COLD_CONCURRENCY:-400}"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
